services:
  cron:
    image: ghcr.io/netresearch/ofelia:latest
    command: ["daemon", "--docker-events", "--enable-web", "--web-address=:8081"]
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      # Web-UI Anbindung an Caddy (kein Host-Port, nur über caddy-Netz erreichbar)
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - CADDY_TYPE=${CADDY_TYPE:-external}
      - CADDY_PORT=${CADDY_PORT:-8081}
      - CADDY_AUTH=true
      - CADDY_AUTH_GROUPS=${CADDY_AUTH_GROUPS:-}
    labels:
      ofelia.service: "true"
      # E-Mail (SMTP) Benachrichtigung
      ofelia.smtp-host: ${SMTP_HOST}
      ofelia.smtp-port: ${SMTP_PORT}
      ofelia.smtp-user: ${SMTP_USER}
      ofelia.smtp-password: ${SMTP_PASS}
      ofelia.email-to: ${SMTP_TO}
      ofelia.email-from: ${SMTP_FROM}
      ofelia.mail-only-on-error: ${SMTP_ERROR}
    networks:
      default:
      caddy:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  caddy:
