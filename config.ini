# Globale Ofelia-Konfiguration.
#
# default-user: Im netresearch-Fork ist der Default "nobody" (Sicherheits-
# Härtung). "default" stellt das alte Verhalten her -> Exec-/Run-Jobs laufen
# als Standard-User des jeweiligen Ziel-Containers (z. B. postgres). Nötig,
# damit Backup-Jobs ins Datenverzeichnis des Containers schreiben duerfen.
# Per-Job ueberschreibbar via ofelia.job-exec.<name>.user.
[global]
default-user = default
