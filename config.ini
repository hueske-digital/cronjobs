# Globale Ofelia-Konfiguration.
#
# default-user: Im netresearch-Fork ist der Default "nobody" (Sicherheits-
# Haertung). Ein LEERER Wert stellt das alte Verhalten her -> Exec-/Run-Jobs
# laufen als Standard-User des jeweiligen Ziel-Containers (z. B. postgres).
# Noetig, damit Backup-Jobs ins Datenverzeichnis des Containers schreiben
# duerfen. Per-Job ueberschreibbar via ofelia.job-exec.<name>.user.
#
# Hinweis: NICHT "default" eintragen - der Sentinel "default" greift nur als
# Per-Job-Wert, global wird er woertlich als Username durchgereicht
# (docker exec --user default -> "no matching entries in passwd file").
[global]
default-user =
